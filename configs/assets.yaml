# Atlas asset universe.
#
# Edit this file to change what Atlas trades - no application code needs to change.
# `asset_class` is used by the portfolio constraint layer to cap concentration in
# any single class, and by the cross-sectional momentum strategy to stop a class
# with many symbols from dominating the cross-sectional ranking.

universe:
  name: "liquid_etf_core"
  description: >-
    Diversified, highly liquid US-listed ETFs spanning equities, fixed income,
    commodities and real estate, plus a cash-like defensive asset.
  base_currency: USD
  trading_calendar: NYSE

  # The benchmark used for regime detection and for buy-and-hold comparison.
  benchmark: SPY
  # Cash-like asset used for the defensive allocation sleeve.
  defensive_asset: BIL

  assets:
    # ---- US equities -------------------------------------------------------
    - symbol: SPY
      name: SPDR S&P 500 ETF Trust
      asset_class: us_equity
      tradable: true
    - symbol: QQQ
      name: Invesco QQQ Trust
      asset_class: us_equity
      tradable: true
    - symbol: IWM
      name: iShares Russell 2000 ETF
      asset_class: us_equity
      tradable: true
    - symbol: DIA
      name: SPDR Dow Jones Industrial Average ETF
      asset_class: us_equity
      tradable: true

    # ---- International equities -------------------------------------------
    - symbol: EFA
      name: iShares MSCI EAFE ETF
      asset_class: intl_equity
      tradable: true
    - symbol: EEM
      name: iShares MSCI Emerging Markets ETF
      asset_class: intl_equity
      tradable: true

    # ---- Fixed income ------------------------------------------------------
    - symbol: TLT
      name: iShares 20+ Year Treasury Bond ETF
      asset_class: fixed_income
      tradable: true
    - symbol: IEF
      name: iShares 7-10 Year Treasury Bond ETF
      asset_class: fixed_income
      tradable: true
    - symbol: SHY
      name: iShares 1-3 Year Treasury Bond ETF
      asset_class: fixed_income
      tradable: true

    # ---- Commodities -------------------------------------------------------
    - symbol: GLD
      name: SPDR Gold Shares
      asset_class: commodity
      tradable: true
    - symbol: SLV
      name: iShares Silver Trust
      asset_class: commodity
      tradable: true
    - symbol: DBC
      name: Invesco DB Commodity Index Tracking Fund
      asset_class: commodity
      tradable: true

    # ---- Real estate -------------------------------------------------------
    - symbol: VNQ
      name: Vanguard Real Estate ETF
      asset_class: real_estate
      tradable: true

    # ---- Defensive / cash-like --------------------------------------------
    - symbol: BIL
      name: SPDR Bloomberg 1-3 Month T-Bill ETF
      asset_class: cash_like
      tradable: true

data:
  provider: yfinance          # yfinance | csv | synthetic
  start_date: "2005-01-01"
  end_date: null              # null -> today
  cache_dir: data/raw
  processed_dir: data/processed
  # Minimum history (trading days) an asset needs before it is eligible to trade.
  min_history_days: 260
  # A symbol whose last observation is older than this many calendar days is
  # considered stale and is excluded from live/paper trading decisions.
  max_staleness_days: 5
