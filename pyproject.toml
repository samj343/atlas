[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trading-system"
version = "0.1.0"
description = "Atlas - a regime-aware, multi-strategy research and paper-trading platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Atlas Contributors" }]
keywords = ["quantitative-finance", "backtesting", "portfolio", "trading", "research"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "plotly>=5.20",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dashboard = ["streamlit>=1.33"]
broker = ["ib_insync>=0.9.86"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "black>=24.3",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs",
]
all = [
    "yfinance>=0.2.40",
    "streamlit>=1.33",
    "ib_insync>=0.9.86",
]

[project.scripts]
atlas = "atlas.cli:main"

[project.urls]
Homepage = "https://github.com/samj343/atlas"
Repository = "https://github.com/samj343/atlas"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests requiring network access (skipped by default in CI)",
    "broker: marks tests requiring a broker connection (always mocked in CI)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
    "E501",    # line length handled by the formatter
    "N803",    # capitalised argument names for matrices (e.g. Sigma) read better
    "N806",    # same, for locals
    "B008",    # pydantic Field(...) defaults are the documented idiom
    "RUF012",  # ClassVar annotations add noise to simple registries
    # Exceptions are named for what happened, not with a mandatory Error suffix:
    # `raise KillSwitchActive(...)` reads better than `KillSwitchActiveError`.
    "N818",
    # `str, Enum` is deliberate rather than `StrEnum`: these values round-trip
    # through YAML, JSON and pydantic, and the explicit `.value` access used
    # throughout the codebase makes the string conversion visible at each site.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802"]
"scripts/*" = ["ARG"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
files = ["src/atlas"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["atlas.dashboard.*"]
ignore_errors = true

# pandas-stubs is deliberately strict about operations whose return type depends
# on runtime shape: `df[mask]` is typed `Series | DataFrame`, `np.log(df)` comes
# back as an ndarray, `Index` loses `.year`, and `.items()` yields `Hashable`
# rather than `str`. In numeric code that is nearly every line, and silencing it
# would mean hundreds of `cast()` calls that add no safety.
#
# These modules therefore relax the shape-dependent error families only. Every
# other check - undefined names, bad signatures, wrong argument counts, missing
# attributes on our own types - still applies, and their behaviour is pinned by
# the test suite instead.
[[tool.mypy.overrides]]
module = [
    "atlas.backtest.engine",
    "atlas.backtest.metrics",
    "atlas.backtest.positions",
    "atlas.data.features",
    "atlas.data.loader",
    "atlas.data.provider",
    "atlas.database.repository",
    "atlas.execution.order_manager",
    "atlas.regimes.clustering",
    "atlas.reporting.performance_report",
    "atlas.strategies.base",
    "atlas.strategies.mean_reversion",
    "atlas.validation.walk_forward",
]
disable_error_code = [
    "operator",
    "arg-type",
    "index",
    "call-overload",
    "union-attr",
    "attr-defined",
    "assignment",
    "return-value",
    "dict-item",
    "misc",
]

[tool.coverage.run]
source = ["src/atlas"]
omit = ["*/dashboard/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
